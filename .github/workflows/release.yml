name: Preview documentation and integrity

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa415ba3cb73621ed34d # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python tools/check_release.py
      - name: Verify the published ZIP and embedded executable
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: python tools/check_release.py --download
